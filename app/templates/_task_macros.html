{% macro priority_badge(p) -%}
  <span class="badge badge-priority-{{ p|lower }}">{{ p }}</span>
{%- endmacro %}

{% macro status_badge(s) -%}
  <span class="badge badge-status-{{ s|lower|replace(' ', '-') }}">{{ s }}</span>
{%- endmacro %}

{% macro status_form(task, statuses) -%}
  <form method="post" action="{{ url_for('tasks.update_status', task_id=task.id) }}" class="m-0">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <select name="status" class="form-select form-select-sm" onchange="this.form.submit()" aria-label="Change status">
      {% for s in statuses %}
        <option value="{{ s }}" {{ 'selected' if s == task.status }}>{{ s }}</option>
      {% endfor %}
    </select>
  </form>
{%- endmacro %}

{% macro delete_button(task) -%}
  <form method="post" action="{{ url_for('tasks.delete', task_id=task.id) }}" class="d-inline m-0"
        data-confirm="Delete the task &quot;{{ task.title }}&quot;? This cannot be undone.">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button class="btn btn-sm btn-outline-danger" title="Delete" aria-label="Delete"><i class="bi bi-trash"></i></button>
  </form>
{%- endmacro %}
