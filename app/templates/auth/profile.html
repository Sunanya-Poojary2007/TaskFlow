{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<h1 class="h3 mb-4">My profile</h1>
<div class="row g-4">
  <div class="col-lg-6">
    <div class="card h-100"><div class="card-body">
      <h2 class="h5 mb-3">Account details</h2>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="action" value="details">
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input class="form-control" id="username" name="username" value="{{ current_user.username }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" value="{{ current_user.email }}" required>
        </div>
        <p class="text-muted small">Member since {{ current_user.created_at.strftime('%d %b %Y') }}</p>
        <button class="btn btn-primary" data-loading="Saving...">Save changes</button>
      </form>
    </div></div>
  </div>
  <div class="col-lg-6">
    <div class="card h-100"><div class="card-body">
      <h2 class="h5 mb-3">Change password</h2>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="action" value="password">
        <div class="mb-3">
          <label class="form-label" for="current_password">Current password</label>
          <input class="form-control" type="password" id="current_password" name="current_password" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="new_password">New password</label>
          <input class="form-control" type="password" id="new_password" name="new_password" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="confirm_password">Confirm new password</label>
          <input class="form-control" type="password" id="confirm_password" name="confirm_password" required>
        </div>
        <button class="btn btn-outline-primary" data-loading="Updating...">Update password</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
