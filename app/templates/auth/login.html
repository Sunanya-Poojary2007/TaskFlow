{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block auth %}
<div class="auth-card">
  <div class="text-center mb-4">
    <div class="auth-logo"><i class="bi bi-check2-square"></i></div>
    <h1 class="h3 mt-2">Welcome back</h1>
    <p class="text-muted">Log in to manage your tasks</p>
  </div>
  {% include "_flash.html" %}
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label" for="identifier">Username or email</label>
      <input class="form-control" id="identifier" name="identifier" value="{{ identifier or '' }}" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password" required>
    </div>
    <button class="btn btn-primary w-100" data-loading="Logging in...">Log in</button>
  </form>
  <p class="text-center mt-3 mb-0">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
