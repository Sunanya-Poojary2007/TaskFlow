{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block auth %}
<div class="auth-card">
  <div class="text-center mb-4">
    <div class="auth-logo"><i class="bi bi-check2-square"></i></div>
    <h1 class="h3 mt-2">Create your account</h1>
    <p class="text-muted">Start organising your work today</p>
  </div>
  {% include "_flash.html" %}
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label" for="username">Username</label>
      <input class="form-control" id="username" name="username" value="{{ username or '' }}" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label" for="email">Email</label>
      <input class="form-control" type="email" id="email" name="email" value="{{ email or '' }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password" required>
      <div class="form-text">At least 8 characters, with letters and numbers.</div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="confirm_password">Confirm password</label>
      <input class="form-control" type="password" id="confirm_password" name="confirm_password" required>
    </div>
    <button class="btn btn-primary w-100" data-loading="Creating account...">Register</button>
  </form>
  <p class="text-center mt-3 mb-0">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
